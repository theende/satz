name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Set up Ende
        uses: ./.github/actions/setup-ende

      - name: Release tag matches ende.json
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(ende eval -p 'JSON.parse(Ende.readTextFileSync("ende.json")).version')"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match version $version in ende.json"
            exit 1
          fi

      - name: Install dependencies
        run: ende install --frozen

      - name: Format, lint, check and test
        run: ende task ok

      - name: Publish to JSR
        run: ende publish
